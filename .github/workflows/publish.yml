name: Publish to PPA

on:
  schedule:
    # Daily at 09:30 UTC, a little after the nixos updater.
    - cron: "30 9 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Publish this version even if it is already recorded (backfill)"
        required: false
        default: ""
      series:
        description: "Space separated series to publish for (empty = the full list)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: publish-ppa
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Restrict manual runs to repo admins
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          permission=$(curl -sSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/collaborators/${ACTOR}/permission" \
            | jq -r '.permission // "unknown"')
          echo "actor ${ACTOR} has permission: ${permission}"
          if [ "$permission" != "admin" ]; then
            echo "::error::Only repo admins can run this workflow manually."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends devscripts debhelper dput distro-info

      - name: Fail if the series list misses a current Ubuntu release
        run: |
          source scripts/common.sh
          missing=$(comm -23 <(ubuntu-distro-info --supported | sort) \
            <(printf '%s\n' "${SERIES[@]}" | sort))
          if [ -n "$missing" ]; then
            echo "::error::SERIES in scripts/common.sh is missing: $(echo $missing). Users on those releases get a broken apt source instead of a package."
            exit 1
          fi

      - name: Check for a newer lerd release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo "Manual backfill of ${INPUT_VERSION}"
            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "version=${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest_tag=$(curl -sSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/lerd-env/lerd/releases/latest \
            | jq -r .tag_name)
          if [ -z "$latest_tag" ] || [ "$latest_tag" = "null" ]; then
            echo "::error::Could not resolve the latest lerd release tag."
            exit 1
          fi
          latest_version="${latest_tag#v}"
          current_version=$(cat published-version)
          echo "current: ${current_version}, latest: ${latest_version}"
          if [ "$latest_version" = "$current_version" ]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "version=${latest_version}" >> "$GITHUB_OUTPUT"
          fi

      - name: Import signing key
        if: steps.check.outputs.updated == 'true'
        id: gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          key_id=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/{print $5; exit}')
          echo "key_id=${key_id}" >> "$GITHUB_OUTPUT"

      - name: Build and upload
        if: steps.check.outputs.updated == 'true'
        env:
          GPG_KEY_ID: ${{ steps.gpg.outputs.key_id }}
          LERD_SERIES: ${{ inputs.series }}
        run: scripts/publish.sh "${{ steps.check.outputs.version }}"

      # A backfill republishes a version that is already recorded, so the
      # record is only written on the scheduled new-release path.
      - name: Record published version
        if: steps.check.outputs.updated == 'true' && inputs.version == ''
        run: |
          echo "${{ steps.check.outputs.version }}" > published-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published-version
          if git diff --staged --quiet; then
            echo "No change to commit."
            exit 0
          fi
          git commit -m "chore: publish lerd ${{ steps.check.outputs.version }} to the PPA"
          git push origin "HEAD:${{ github.ref_name }}"
